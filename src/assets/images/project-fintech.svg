  <text x="15" y="321" font-family="Inter, sans-serif" font-size="12" fill="#FF6B6B" text-anchor="end">complexity</text>
  
  <g stroke="#FF6B6B" stroke-width="2" fill="none" stroke-dasharray="5,5">
    <rect x="70" y="410" width="660" height="120"/>
    <line x1="780" y1="470" x2="730" y2="470"/>
  </g>
  <text x="785" y="467" font-family="Inter, sans-serif" font-size="12" fill="#FF6B6B">Progressive onboarding</text>
