<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Multiple device mockup -->
  <!-- Desktop Browser -->
  <rect x="50" y="50" width="400" height="250" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <rect x="50" y="50" width="400" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="70" cy="65" r="4" fill="#EF4444"/>
  <circle cx="85" cy="65" r="4" fill="#F59E0B"/>
  <circle cx="100" cy="65" r="4" fill="#10B981"/>
  
  <!-- Desktop Content -->
  <rect x="60" y="90" width="380" height="200" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="70" y="100" width="100" height="60" rx="4" fill="#3B82F6"/>
  <text x="120" y="135" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">TaskFlow</text>
  
  <!-- Navigation -->
  <rect x="190" y="110" width="40" height="8" rx="4" fill="#64748B"/>
  <rect x="240" y="110" width="50" height="8" rx="4" fill="#64748B"/>
  <rect x="300" y="110" width="45" height="8" rx="4" fill="#64748B"/>
  <rect x="355" y="110" width="55" height="8" rx="4" fill="#64748B"/>
  
  <!-- Main content area -->
  <rect x="70" y="180" width="360" height="100" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="80" y="200" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1E293B">Active Projects</text>
  
  <!-- Project cards -->
  <rect x="80" y="210" width="100" height="60" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="90" y="220" width="60" height="6" rx="3" fill="#3B82F6"/>
  <rect x="90" y="235" width="80" height="4" rx="2" fill="#94A3B8"/>
  <rect x="90" y="245" width="50" height="4" rx="2" fill="#94A3B8"/>
  
  <rect x="195" y="210" width="100" height="60" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="205" y="220" width="70" height="6" rx="3" fill="#10B981"/>
  <rect x="205" y="235" width="75" height="4" rx="2" fill="#94A3B8"/>
  <rect x="205" y="245" width="60" height="4" rx="2" fill="#94A3B8"/>
  
  <rect x="310" y="210" width="100" height="60" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="320" y="220" width="55" height="6" rx="3" fill="#F59E0B"/>
  <rect x="320" y="235" width="85" height="4" rx="2" fill="#94A3B8"/>
  <rect x="320" y="245" width="40" height="4" rx="2" fill="#94A3B8"/>
  
  <!-- Tablet -->
  <rect x="500" y="80" width="200" height="300" rx="12" fill="#1F2937"/>
  <rect x="510" y="100" width="180" height="260" rx="8" fill="#FFFFFF"/>
  
  <!-- Tablet header -->
  <rect x="520" y="110" width="160" height="40" rx="6" fill="#3B82F6"/>
  <text x="600" y="135" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">TaskFlow Mobile</text>
  
  <!-- Tablet content -->
  <rect x="520" y="170" width="160" height="50" rx="6" fill="#F0F9FF" stroke="#BFDBFE"/>
  <circle cx="540" cy="190" r="8" fill="#3B82F6"/>
  <rect x="555" y="185" width="80" height="6" rx="3" fill="#1E293B"/>
  <rect x="555" y="195" width="60" height="4" rx="2" fill="#64748B"/>
  <rect x="555" y="205" width="40" height="4" rx="2" fill="#64748B"/>
  
  <rect x="520" y="235" width="160" height="50" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
  <circle cx="540" cy="255" r="8" fill="#10B981"/>
  <rect x="555" y="250" width="85" height="6" rx="3" fill="#1E293B"/>
  <rect x="555" y="260" width="70" height="4" rx="2" fill="#64748B"/>
  <rect x="555" y="270" width="50" height="4" rx="2" fill="#64748B"/>
  
  <rect x="520" y="300" width="160" height="50" rx="6" fill="#FFFBEB" stroke="#FDE68A"/>
  <circle cx="540" cy="320" r="8" fill="#F59E0B"/>
  <rect x="555" y="315" width="75" height="6" rx="3" fill="#1E293B"/>
  <rect x="555" y="325" width="65" height="4" rx="2" fill="#64748B"/>
  <rect x="555" y="335" width="45" height="4" rx="2" fill="#64748B"/>
  
  <!-- Phone -->
  <rect x="300" y="350" width="120" height="200" rx="20" fill="#1F2937"/>
  <rect x="310" y="365" width="100" height="170" rx="12" fill="#FFFFFF"/>
  
  <!-- Phone status bar -->
  <rect x="320" y="375" width="80" height="12" fill="#F8FAFC"/>
  <circle cx="330" cy="381" r="2" fill="#10B981"/>
  <rect x="395" y="378" width="12" height="6" rx="1" fill="#64748B"/>
  
  <!-- Phone header -->
  <rect x="320" y="395" width="80" height="25" rx="4" fill="#3B82F6"/>
  <text x="360" y="410" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tasks</text>
  
  <!-- Phone task list -->
  <rect x="320" y="430" width="80" height="25" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle cx="330" cy="440" r="4" fill="#3B82F6"/>
  <rect x="340" y="437" width="40" height="3" rx="1" fill="#1E293B"/>
  <rect x="340" y="443" width="30" height="2" rx="1" fill="#64748B"/>
  
  <rect x="320" y="465" width="80" height="25" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle cx="330" cy="475" r="4" fill="#10B981"/>
  <rect x="340" y="472" width="45" height="3" rx="1" fill="#1E293B"/>
  <rect x="340" y="478" width="35" height="2" rx="1" fill="#64748B"/>
  
  <rect x="320" y="500" width="80" height="25" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle cx="330" cy="510" r="4" fill="#F59E0B"/>
  <rect x="340" y="507" width="40" height="3" rx="1" fill="#1E293B"/>
  <rect x="340" y="513" width="25" height="2" rx="1" fill="#64748B"/>
  
  <!-- Design annotations -->
  <g stroke="#FF6B6B" stroke-width="2" fill="none" stroke-dasharray="5,5">
    <path d="M 100 320 Q 200 340 280 380"/>
    <path d="M 350 320 Q 420 340 480 360"/>
  </g>
  <text x="190" y="330" font-family="Inter, sans-serif" font-size="12" fill="#FF6B6B" text-anchor="middle">Consistent experience</text>
  <text x="190" y="345" font-family="Inter, sans-serif" font-size="12" fill="#FF6B6B" text-anchor="middle">across all devices</text>
  
  <!-- User flow arrows -->
  <path d="M 250 200 L 290 200" stroke="#3B82F6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 480 200 L 520 200" stroke="#3B82F6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
  </defs>
  
  <text x="350" y="190" font-family="Inter, sans-serif" font-size="11" fill="#3B82F6" text-anchor="middle">Responsive Design</text>
</svg>