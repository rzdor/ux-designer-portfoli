<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Mobile phone frame -->
  <rect x="250" y="50" width="300" height="500" rx="25" fill="#1F1F1F"/>
  <rect x="265" y="70" width="270" height="460" rx="15" fill="#FFFFFF"/>
  
  <!-- Status bar -->
  <rect x="275" y="85" width="250" height="20" fill="#F8F9FA"/>
  <circle cx="295" cy="95" r="3" fill="#34D399"/>
  <rect x="300" y="92" width="20" height="6" rx="1" fill="#9CA3AF"/>
  <rect x="480" y="90" width="15" height="10" rx="2" fill="#9CA3AF"/>
  <rect x="500" y="92" width="20" height="6" rx="3" fill="#9CA3AF"/>
  
  <!-- Header -->
  <rect x="275" y="120" width="250" height="50" fill="#059669"/>
  <circle cx="300" cy="145" r="15" fill="#FFFFFF"/>
  <text x="325" y="150" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">HealthTrack</text>
  <circle cx="490" cy="145" r="12" fill="#FFFFFF" fill-opacity="0.2"/>
  
  <!-- Medication reminder card -->
  <rect x="285" y="190" width="230" height="80" rx="12" fill="#F0FDF4" stroke="#BBF7D0"/>
  <circle cx="305" cy="215" r="8" fill="#059669"/>
  <rect x="320" y="205" width="60" height="8" rx="4" fill="#059669"/>
  <rect x="320" y="220" width="100" height="6" rx="3" fill="#9CA3AF"/>
  <rect x="320" y="235" width="80" height="6" rx="3" fill="#9CA3AF"/>
  <rect x="465" y="210" width="40" height="20" rx="10" fill="#059669"/>
  <text x="480" y="223" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#FFFFFF" text-anchor="middle">Take</text>
  
  <!-- Today's schedule -->
  <text x="285" y="300" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#1F2937">Today's Schedule</text>
  
  <!-- Schedule items -->
  <rect x="285" y="320" width="230" height="50" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="305" cy="340" r="6" fill="#3B82F6"/>
  <rect x="320" y="335" width="80" height="6" rx="3" fill="#1F2937"/>
  <rect x="320" y="345" width="60" height="5" rx="2" fill="#9CA3AF"/>
  <text x="490" y="348" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280" text-anchor="end">8:00 AM</text>
  
  <rect x="285" y="380" width="230" height="50" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="305" cy="400" r="6" fill="#EF4444"/>
  <rect x="320" y="395" width="90" height="6" rx="3" fill="#1F2937"/>
  <rect x="320" y="405" width="70" height="5" rx="2" fill="#9CA3AF"/>
  <text x="490" y="408" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280" text-anchor="end">2:00 PM</text>
  
  <rect x="285" y="440" width="230" height="50" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="305" cy="460" r="6" fill="#F59E0B"/>
  <rect x="320" y="455" width="85" height="6" rx="3" fill="#1F2937"/>
  <rect x="320" y="465" width="65" height="5" rx="2" fill="#9CA3AF"/>
  <text x="490" y="468" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280" text-anchor="end">6:00 PM</text>
  
  <!-- Floating action button -->
  <circle cx="480" cy="480" r="25" fill="#059669"/>
  <line x1="470" y1="480" x2="490" y2="480" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="480" y1="470" x2="480" y2="490" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Design annotations -->
  <g stroke="#FF6B6B" stroke-width="2" fill="none" stroke-dasharray="5,5">
    <rect x="230" y="180" width="340" height="100"/>
    <line x1="130" y1="230" x2="230" y2="230"/>
  </g>
  <text x="125" y="227" font-family="Inter, sans-serif" font-size="12" fill="#FF6B6B" text-anchor="end">Prominent CTA for</text>
  <text x="125" y="240" font-family="Inter, sans-serif" font-size="12" fill="#FF6B6B" text-anchor="end">medication adherence</text>
  
  <g stroke="#FF6B6B" stroke-width="2" fill="none" stroke-dasharray="5,5">
    <circle cx="480" cy="480" r="35"/>
    <line x1="580" y1="480" x2="515" y2="480"/>
  </g>
  <text x="585" y="477" font-family="Inter, sans-serif" font-size="12" fill="#FF6B6B">Quick add</text>
  <text x="585" y="490" font-family="Inter, sans-serif" font-size="12" fill="#FF6B6B">medication</text>
</svg>